
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RP Universe</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090610;color:#eee;
 font-family:Arial,sans-serif;padding:20px;
}
header{padding:20px 0}
h1{color:#b66aff;font-size:30px}
p{color:#a99ab9}
input,textarea,button{
 width:100%;padding:14px;margin:7px 0;
 border-radius:12px;border:1px solid #543078;
 background:#160d20;color:white;font-size:15px;
}
button{
 background:linear-gradient(100deg,#7925d9,#a64aff);
 border:0;font-weight:bold;cursor:pointer;
}
.card{
 background:#160e20;border:1px solid #542878;
 border-radius:16px;padding:16px;margin:12px 0;
}
.card h3{color:#c78aff}
nav{display:flex;gap:8px;margin:20px 0}
nav button{font-size:13px;padding:12px 5px}
.hidden{display:none}
small{color:#b89bd2}
</style>
</head>
<body>

<header>
<h1>✦ RP Universe</h1>
<p>Твой мир. Твои персонажи.</p>
</header>

<input id="search" placeholder="⌕ Поиск персонажей..."
oninput="render()">

<nav>
<button onclick="show('catalog')">Каталог</button>
<button onclick="show('create')">Создать</button>
<button onclick="show('mine')">Мои персонажи</button>
</nav>

<section id="catalog">
<h2>Каталог персонажей</h2>
<div id="characters"></div>
</section>

<section id="create" class="hidden">
<h2>Создание персонажа</h2>
<input id="name" placeholder="Имя персонажа">
<input id="fandom" placeholder="Фандом / ОС">
<input id="avatar" placeholder="Ссылка на аватар">
<textarea id="description" placeholder="Характер персонажа"></textarea>
<textarea id="bio" placeholder="Биография"></textarea>
<label>
<input type="checkbox" id="public" style="width:auto">
Общедоступный персонаж
</label>
<button onclick="createCharacter()">Создать персонажа</button>
</section>

<section id="mine" class="hidden">
<h2>Мои персонажи</h2>
<div id="myCharacters"></div>
</section>

<script>
let characters=JSON.parse(
 localStorage.getItem("characters")||"[]"
);

function save(){
 localStorage.setItem("characters",
 JSON.stringify(characters));
}

function show(page){
 document.querySelectorAll("section").forEach(
 s=>s.classList.add("hidden")
 );
 document.getElementById(page).classList.remove("hidden");
 render();
}

function createCharacter(){
 let name=document.getElementById("name").value.trim();
 let fandom=document.getElementById("fandom").value.trim();

 if(!name){alert("Введи имя персонажа!");return;}

 characters.push({
 name,
 fandom,
 avatar:document.getElementById("avatar").value,
 description:document.getElementById("description").value,
 bio:document.getElementById("bio").value,
 public:document.getElementById("public").checked
 });

 save();
 ["name","fandom","avatar","description","bio"].forEach(
 id=>document.getElementById(id).value=""
 );
 document.getElementById("public").checked=false;
 alert("Персонаж создан!");
 show("mine");
}

function card(c){
 return `<div class="card">
 ${c.avatar?`<img src="${escapeAttr(c.avatar)}" style="width:90px;height:90px;object-fit:cover;border-radius:12px">`:""}
 <h3>${escapeHTML(c.name)}</h3>
 <small>${escapeHTML(c.fandom||"Без фандома")}</small>
 <p>${escapeHTML(c.description||"Нет описания")}</p>
 <small>${c.public?"🌐 Общедоступный":"🔒 Личный"}</small>
 </div>`;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 }[c]));
}
function escapeAttr(s){return escapeHTML(s);}

function render(){
 let query=document.getElementById("search").value.toLowerCase();
 let visible=characters.filter(c=>
 c.public&&(c.name+" "+c.fandom).toLowerCase().includes(query)
 );
 document.getElementById("characters").innerHTML=
 visible.map(card).join("")||"<p>Пока нет персонажей.</p>";

 document.getElementById("myCharacters").innerHTML=
 characters.map(card).join("")||"<p>Ты ещё не создал персонажей.</p>";
}
render();
</script>
</body>
</html>
